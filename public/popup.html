<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNIDorm 포털 연동 도우미</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
        color: #191f28;
        background: #ffffff;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 16px;
        font-weight: 700;
      }
      p {
        margin: 0 0 14px;
        font-size: 12px;
        line-height: 1.5;
        color: #4e5968;
      }
      .status-box {
        padding: 12px;
        border-radius: 10px;
        background: #f2f4f6;
        margin-bottom: 12px;
        font-size: 13px;
      }
      .status-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
      }
      .status-row:last-child {
        margin-bottom: 0;
      }
      .label {
        color: #6b7684;
      }
      .value {
        font-weight: 600;
        color: #191f28;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      button {
        width: 100%;
        padding: 10px 12px;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-primary {
        background: #3182f6;
        color: #ffffff;
      }
      .btn-secondary {
        background: #f2f4f6;
        color: #333d4b;
      }
      .note {
        margin-top: 10px;
        font-size: 11px;
        color: #8b95a1;
      }
    </style>
  </head>
  <body>
    <h1>UNIDorm 포털 연동</h1>
    <p>포털 로그인 세션과 자격증명은 이 브라우저에서만 사용되며 외부 서버로 전송되지 않습니다.</p>

    <div class="status-box">
      <div class="status-row">
        <span class="label">연동 상태</span>
        <span class="value" id="status-linked">확인 중...</span>
      </div>
      <div class="status-row">
        <span class="label">학번</span>
        <span class="value" id="status-student-id">-</span>
      </div>
      <div class="status-row">
        <span class="label">포털 브라우저 세션</span>
        <span class="value" id="status-cookie">-</span>
      </div>
    </div>

    <div class="actions">
      <button id="btn-open-portal" class="btn-primary" type="button">
        인천대 포털 로그인 열기
      </button>
      <button id="btn-clear-session" class="btn-secondary" type="button">
        저장된 세션 자격증명 삭제
      </button>
    </div>

    <div class="note" id="feedback"></div>
    <script src="popup.js"></script>
  </body>
</html>
